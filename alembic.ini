# Configuracion de Alembic.
# La URL NO se pone aqui: se lee de DATABASE_URL en el .env desde
# migraciones/env.py, para que la contrasena nunca acabe en un archivo
# versionado.

[alembic]
script_location = migraciones
prepend_sys_path = .
path_separator = os
# Sin 'timezone': Windows no trae la base de zonas IANA y Alembic falla al
# resolver 'UTC' salvo que se instale el paquete tzdata. La fecha del nombre de
# archivo en hora local basta para ordenar el historial.

# Nombre de archivo con fecha: al revisar el historial se ve el orden real.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
